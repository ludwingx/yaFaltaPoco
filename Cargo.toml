[package]
name = "yafaltapoco"
version = "1.0.0"
edition = "2021"
authors = ["ludwingx"]
description = "Temporizador y agenda diaria por bloques de horario flotante"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.29.1", default-features = false }
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tray-icon = "0.19.0"
global-hotkey = "0.6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices", "Win32_Media_Audio"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
