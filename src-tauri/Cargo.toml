[package]
name = "yafaltapoco"
version = "1.0.0"
description = "Ya Falta Poco - Temporizador y Agenda por Bloques"
authors = ["ludwingx"]
edition = "2021"

[[bin]]
name = "yafaltapoco"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
