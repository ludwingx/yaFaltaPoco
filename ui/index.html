<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ya Falta Poco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --s: 1;
      --bg-surface: #000000;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --blue-accent: #3b82f6;
      --blue-glow: #1d4ed8;
      --green-ring: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #000000;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      display: block;
    }

    /* Widget Exterior: Llena la ventana y escala proporcionalmente */
    .widget-container {
      width: 100%;
      height: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: calc(var(--s) * 24px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.95);
      padding: calc(var(--s) * 12px) calc(var(--s) * 16px) calc(var(--s) * 12px) calc(var(--s) * 16px);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Barra Superior */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: calc(var(--s) * 10px);
      cursor: grab;
      padding: 0 calc(var(--s) * 2px);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .top-bar:active {
      cursor: grabbing;
    }

    .brand-tag {
      font-size: calc(var(--s) * 11px);
      font-weight: 700;
      letter-spacing: calc(var(--s) * 1.2px);
      color: var(--text-dim);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 7px);
    }

    .brand-dot {
      width: calc(var(--s) * 7px);
      height: calc(var(--s) * 7px);
      border-radius: 50%;
      background: #06b6d4;
      box-shadow: 0 0 calc(var(--s) * 8px) #06b6d4;
    }

    .top-actions {
      display: flex;
      gap: calc(var(--s) * 6px);
      align-items: center;
    }

    .btn-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: calc(var(--s) * 11px);
      font-weight: 600;
      padding: calc(var(--s) * 3px) calc(var(--s) * 9px);
      border-radius: calc(var(--s) * 16px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 5px);
      transition: all 0.15s;
    }

    .btn-pill:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-white);
    }

    .btn-close {
      width: calc(var(--s) * 22px);
      height: calc(var(--s) * 22px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: none;
      color: var(--text-dim);
      font-size: calc(var(--s) * 11px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-close:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .btn-icon {
      width: calc(var(--s) * 22px);
      height: calc(var(--s) * 22px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: calc(var(--s) * 11px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-white);
      transform: scale(1.08);
    }

    @keyframes alarm-pulse {
      0%, 100% { transform: scale(1); text-shadow: 0 0 16px rgba(59, 130, 246, 0.45); }
      50% { transform: scale(1.06); text-shadow: 0 0 24px #38bdf8, 0 0 40px #38bdf8; color: #38bdf8; }
    }

    /* Grid de Contenido */
    .content-layout {
      display: grid;
      grid-template-columns: minmax(calc(var(--s) * 160px), calc(var(--s) * 205px)) 1fr;
      gap: calc(var(--s) * 14px);
      flex: 1;
      min-height: 0;
      height: calc(100% - calc(var(--s) * 32px));
      position: relative;
      z-index: 1;
    }

    /* Columna Izquierda: Logo prominente + Temporizador minimalista (sin card) */
    .timer-column {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: calc(var(--s) * 4px) calc(var(--s) * 8px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      height: 100%;
      position: relative;
      user-select: none;
    }

    .date-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--s) * 2px);
    }

    .date-main {
      font-size: calc(var(--s) * 16px);
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.3px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .clock-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--s) * 12px);
      color: var(--text-muted);
    }

    /* GIF de marca prominente y visible arriba del temporizador */
    .logo-hub {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      position: relative;
    }

    .logo-gif-img {
      width: calc(var(--s) * 94px);
      height: calc(var(--s) * 94px);
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 0 calc(var(--s) * 20px) rgba(59, 130, 246, 0.55));
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .countdown-hub {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: calc(var(--s) * 6px);
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--s) * 32px);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1.1;
      text-shadow: 0 0 calc(var(--s) * 16px) rgba(59, 130, 246, 0.45);
    }

    .timer-sublabel {
      font-size: calc(var(--s) * 11px);
      font-weight: 600;
      color: #93c5fd;
      margin-top: calc(var(--s) * 5px);
      max-width: calc(var(--s) * 185px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Columna Derecha (Agenda estilo Timeline de referencia) */
    .agenda-section {
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      min-height: 0;
    }

    .agenda-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: calc(var(--s) * 6px);
      padding: 0 2px;
      flex-shrink: 0;
    }

    .agenda-title {
      font-size: calc(var(--s) * 11px);
      font-weight: 700;
      letter-spacing: calc(var(--s) * 1.5px);
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .agenda-count-badge {
      font-size: calc(var(--s) * 9.5px);
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: calc(var(--s) * 1px) calc(var(--s) * 7px);
      border-radius: calc(var(--s) * 8px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .timeline-stream {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      padding-right: calc(var(--s) * 4px);
      position: relative;
    }

    .timeline-stream::-webkit-scrollbar {
      width: calc(var(--s) * 4px);
    }
    .timeline-stream::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    /* Extremos de la Vía (Sun / Moon) */
    .timeline-pole {
      display: flex;
      align-items: center;
      height: calc(var(--s) * 14px);
      padding-left: calc(var(--s) * 12px);
      flex-shrink: 0;
    }
    .pole-icon {
      font-size: calc(var(--s) * 10px);
      line-height: 1;
      opacity: 0.6;
      filter: grayscale(0.2);
    }

    /* Fila de Timeline */
    .timeline-row {
      display: flex;
      align-items: stretch;
      gap: calc(var(--s) * 10px);
      position: relative;
      margin-bottom: calc(var(--s) * 6px);
    }

    /* Columna del Riel */
    .timeline-rail {
      width: calc(var(--s) * 34px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      flex-shrink: 0;
    }

    .rail-track-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--s) * 2px);
      background: rgba(255, 255, 255, 0.1);
      z-index: 1;
    }

    .timeline-capsule {
      width: calc(var(--s) * 32px);
      height: calc(var(--s) * 42px);
      border-radius: calc(var(--s) * 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--s) * 15px);
      position: relative;
      z-index: 2;
      margin: auto 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }

    .timeline-row.active .timeline-capsule {
      transform: scale(1.08);
    }

    .timeline-row.completed .timeline-capsule {
      opacity: 0.5;
      filter: grayscale(0.5);
    }

    /* Tarjeta de Contenido */
    .timeline-card {
      flex: 1;
      min-width: 0;
      background: #141720;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: calc(var(--s) * 12px);
      padding: calc(var(--s) * 8px) calc(var(--s) * 12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--s) * 8px);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
    }

    .timeline-card:hover {
      background: #1a1e2b;
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateX(calc(var(--s) * 2px));
    }

    .timeline-row.active .timeline-card {
      background: rgba(30, 41, 59, 0.7);
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 0 calc(var(--s) * 14px) rgba(59, 130, 246, 0.15);
    }

    .timeline-row.completed .timeline-card {
      opacity: 0.55;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: calc(var(--s) * 2px);
      min-width: 0;
      flex: 1;
    }

    .card-title {
      font-size: calc(var(--s) * 13px);
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timeline-row.completed .card-title {
      text-decoration: line-through;
      color: #64748b;
    }

    .card-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--s) * 10.5px);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 4px);
    }

    .timeline-row.active .card-time {
      color: #60a5fa;
      font-weight: 600;
    }

    .card-duration {
      color: var(--text-dim);
      font-size: calc(var(--s) * 10px);
      opacity: 0.85;
    }

    /* Checkbox / Indicador en la tarjeta */
    .card-checkbox {
      width: calc(var(--s) * 18px);
      height: calc(var(--s) * 18px);
      border-radius: calc(var(--s) * 5px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--s) * 11px);
      font-weight: 800;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    /* Línea Indicadora de Hora Actual (como en la imagen con 08:18 roja) */
    .timeline-now-divider {
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 6px);
      margin: calc(var(--s) * -2px) 0 calc(var(--s) * 4px) calc(var(--s) * 2px);
      position: relative;
      z-index: 10;
    }

    .now-time-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--s) * 9px);
      font-weight: 700;
      color: #f87171;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: calc(var(--s) * 1px) calc(var(--s) * 5px);
      border-radius: calc(var(--s) * 4px);
      line-height: 1.2;
      flex-shrink: 0;
    }

    .now-red-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, #ef4444 0%, rgba(239, 68, 68, 0.4) 75%, transparent 100%);
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.65);
    }

    /* Footer de la Agenda (Fin de jornada + Botón Crear) */
    .timeline-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: calc(var(--s) * 6px);
      padding-top: calc(var(--s) * 4px);
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .end-of-day-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--s) * 10px);
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(var(--s) * 230px);
    }

    .btn-create-event {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
      font-size: calc(var(--s) * 11px);
      font-weight: 600;
      padding: calc(var(--s) * 3px) calc(var(--s) * 10px);
      border-radius: calc(var(--s) * 7px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 5px);
      transition: all 0.15s ease;
    }

    .btn-create-event:hover {
      background: rgba(255, 255, 255, 0.13);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .free-day-banner {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(6, 182, 212, 0.08));
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: calc(var(--s) * 11px);
      padding: calc(var(--s) * 8px) calc(var(--s) * 11px);
      display: flex;
      flex-direction: column;
      gap: calc(var(--s) * 3px);
      margin-bottom: calc(var(--s) * 6px);
    }

    .free-day-badge {
      font-size: calc(var(--s) * 10.5px);
      font-weight: 800;
      color: #34d399;
      letter-spacing: calc(var(--s) * 0.8px);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 5px);
    }

    .free-day-text {
      font-size: calc(var(--s) * 10px);
      color: var(--text-muted);
      line-height: 1.3;
    }

    .stream-section-divider {
      font-size: calc(var(--s) * 9px);
      font-weight: 700;
      letter-spacing: calc(var(--s) * 1.2px);
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: calc(var(--s) * 4px);
      margin-bottom: calc(var(--s) * 4px);
      padding-left: 2px;
    }

    /* Manijas de Redimensionamiento */
    .resize-handle.corner-se {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 22px;
      height: 22px;
      cursor: se-resize;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 4px;
      z-index: 60;
    }

    .resize-grip {
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(255, 255, 255, 0.4);
      border-bottom: 2px solid rgba(255, 255, 255, 0.4);
      border-bottom-right-radius: 2px;
      transition: border-color 0.15s, transform 0.15s;
    }

    .resize-handle.corner-se:hover .resize-grip {
      border-color: #38bdf8;
      transform: scale(1.2);
    }

    .resize-handle.edge-r {
      position: absolute;
      right: 0;
      top: 15px;
      bottom: 22px;
      width: 6px;
      cursor: e-resize;
      z-index: 40;
    }

    .resize-handle.edge-b {
      position: absolute;
      left: 15px;
      right: 22px;
      bottom: 0;
      height: 6px;
      cursor: s-resize;
      z-index: 40;
    }

    /* Modal Editor Integrado */
    .editor-overlay {
      position: absolute;
      inset: calc(var(--s) * 10px) calc(var(--s) * 14px);
      background: rgba(4, 5, 8, 0.98);
      border: 1px solid var(--border-subtle);
      border-radius: calc(var(--s) * 18px);
      padding: calc(var(--s) * 14px) calc(var(--s) * 18px);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      z-index: 30;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.95);
    }

    .editor-overlay.visible {
      display: flex;
    }

    .editor-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-heading {
      font-size: calc(var(--s) * 14px);
      font-weight: 700;
      color: var(--text-white);
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 10px);
    }

    .form-label {
      font-size: calc(var(--s) * 12px);
      font-weight: 600;
      color: var(--text-muted);
      width: calc(var(--s) * 55px);
    }

    .text-field {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: calc(var(--s) * 8px);
      padding: calc(var(--s) * 5px) calc(var(--s) * 10px);
      color: #ffffff;
      font-size: calc(var(--s) * 12.5px);
      outline: none;
    }

    .text-field:focus {
      border-color: var(--blue-accent);
    }

    .time-inputs {
      display: flex;
      align-items: center;
      gap: calc(var(--s) * 5px);
    }

    .time-field {
      width: calc(var(--s) * 48px);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: calc(var(--s) * 7px);
      padding: calc(var(--s) * 4px) calc(var(--s) * 5px);
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: calc(var(--s) * 12px);
      text-align: center;
      outline: none;
    }

    .time-field:focus {
      border-color: var(--blue-accent);
    }

    .palette-row {
      display: flex;
      gap: calc(var(--s) * 7px);
    }

    .swatch {
      width: calc(var(--s) * 20px);
      height: calc(var(--s) * 20px);
      border-radius: calc(var(--s) * 5px);
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s;
    }

    .swatch:hover, .swatch.selected {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: calc(var(--s) * 8px);
      margin-top: calc(var(--s) * 4px);
    }

    .action-btn {
      padding: calc(var(--s) * 5px) calc(var(--s) * 14px);
      border-radius: calc(var(--s) * 7px);
      font-size: calc(var(--s) * 12px);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-save {
      background: var(--blue-accent);
      color: #ffffff;
    }
    .btn-save:hover {
      background: #2563eb;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <!-- Barra Superior -->
    <div class="top-bar" data-tauri-drag-region>
      <div class="brand-tag" data-tauri-drag-region>
        <span class="brand-dot"></span>YA FALTA POCO
      </div>
      <div class="top-actions">
        <button class="btn-icon" id="btn-sound" title="Sonido activado (clic para probar, clic derecho para silenciar)">🔔</button>
        <button class="btn-pill" id="btn-mode">Horario</button>
        <button class="btn-close" id="btn-close" title="Cerrar">✕</button>
      </div>
    </div>

    <!-- Contenido -->
    <div class="content-layout">
      <!-- Columna Izquierda: Logo prominente + Temporizador minimalista (sin card) -->
      <div class="timer-column">
        <div class="date-row">
          <span class="date-main" id="lbl-date">-- --</span>
          <span class="clock-badge" id="lbl-time">00:00:00</span>
        </div>

        <div class="logo-hub">
          <img src="bg-logo.gif" alt="Workspace Logo" class="logo-gif-img">
        </div>

        <div class="countdown-hub">
          <div class="timer-display" id="lbl-countdown">--:--:--</div>
          <div class="timer-sublabel" id="lbl-block-name">Cargando...</div>
        </div>
      </div>

      <!-- Columna Derecha: Timeline de Turnos (Inspirado en la imagen de referencia) -->
      <div class="agenda-section">
        <div class="agenda-header-row">
          <span class="agenda-title">HOY</span>
          <span class="agenda-count-badge" id="lbl-agenda-badge">3 turnos</span>
        </div>

        <div class="timeline-stream" id="schedule-container">
          <!-- Bloques y timeline inyectados dinámicamente -->
        </div>

        <div class="timeline-footer">
          <div class="end-of-day-label" id="lbl-end-of-day">Fin de jornada: --</div>
          <button class="btn-create-event" id="btn-open-editor">
            <span style="font-weight:700">+</span> Crear turno
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Editor Integrado -->
    <div class="editor-overlay" id="editor-overlay">
      <div class="editor-top">
        <span class="editor-heading" id="modal-title">Nuevo Bloque</span>
        <button class="btn-close" id="btn-close-modal">✕</button>
      </div>

      <div class="form-group">
        <span class="form-label">Nombre</span>
        <input type="text" id="inp-title" class="text-field" placeholder="Nombre de la actividad">
      </div>

      <div class="form-group">
        <span class="form-label">Horario</span>
        <div class="time-inputs">
          <input type="number" id="inp-start-h" class="time-field" min="0" max="23" value="08">
          <span style="color:var(--text-dim)">:</span>
          <input type="number" id="inp-start-m" class="time-field" min="0" max="59" value="00">
          <span style="color:var(--text-dim); margin: 0 4px">hasta</span>
          <input type="number" id="inp-end-h" class="time-field" min="0" max="23" value="12">
          <span style="color:var(--text-dim)">:</span>
          <input type="number" id="inp-end-m" class="time-field" min="0" max="59" value="00">
        </div>
      </div>

      <div class="form-group">
        <span class="form-label">Color</span>
        <div class="palette-row" id="palette-row"></div>
      </div>

      <div class="footer-actions">
        <button class="action-btn btn-delete" id="btn-delete" style="display:none">Eliminar</button>
        <button class="action-btn btn-cancel" id="btn-cancel">Cancelar</button>
        <button class="action-btn btn-save" id="btn-save">Guardar</button>
      </div>
    </div>
    <audio id="snd-alarm" src="alarm.mp3" preload="auto"></audio>

    <!-- Manijas de Redimensionamiento -->
    <div class="resize-handle corner-se" id="resize-corner" title="Arrastrar esquina para cambiar tamaño">
      <div class="resize-grip"></div>
    </div>
    <div class="resize-handle edge-r" id="resize-edge-r" title="Arrastrar borde para cambiar ancho"></div>
    <div class="resize-handle edge-b" id="resize-edge-b" title="Arrastrar borde para cambiar alto"></div>
  </div>

  <script>
    const hasTauri = typeof window !== 'undefined' && window.__TAURI__ && window.__TAURI__.core;

    // Entorno de desarrollo para previsualización instantánea en navegador sin compilar
    let devMockState = {
      mode: 'Horario',
      sound_enabled: true,
      blocks: [
        {
          id: 'block-1',
          title: 'OtherBrain I',
          start_hour: 8,
          start_min: 0,
          end_hour: 12,
          end_min: 0,
          color: { r: 37, g: 99, b: 235 },
          days: { monday: true, tuesday: true, wednesday: true, thursday: true, friday: true, saturday: true, sunday: false }
        },
        {
          id: 'block-2',
          title: 'Almuerzo',
          start_hour: 12,
          start_min: 0,
          end_hour: 13,
          end_min: 0,
          color: { r: 245, g: 158, b: 11 },
          days: { monday: true, tuesday: true, wednesday: true, thursday: true, friday: true, saturday: true, sunday: false }
        },
        {
          id: 'block-3',
          title: 'OtherBrain II',
          start_hour: 13,
          start_min: 0,
          end_hour: 20,
          end_min: 0,
          color: { r: 37, g: 99, b: 235 },
          days: { monday: true, tuesday: true, wednesday: true, thursday: true, friday: true, saturday: true, sunday: false }
        }
      ]
    };

    async function mockInvoke(cmd, args = {}) {
      if (cmd === 'get_snapshot') {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        const monthNames = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        const isSunday = now.getDay() === 0;
        const dateTitle = isSunday
          ? `${pad(now.getDate())} ${monthNames[now.getMonth()]} ${now.getFullYear()}`
          : `${dayNames[now.getDay()]} ${pad(now.getDate())} ${monthNames[now.getMonth()]} ${now.getFullYear()}`;

        return {
          date_title: dateTitle,
          current_time_str: timeStr,
          weekday_str: isSunday ? 'Domingo' : dayNames[now.getDay()],
          countdown_str: isSunday ? 'LIBRE' : '02:44:15',
          block_name: isSunday ? '¡Domingo Free! 🎉' : 'Termina: OtherBrain I',
          events_count_str: `${devMockState.blocks.length} turnos`,
          mode: devMockState.mode,
          blocks: devMockState.blocks,
          is_free_day: isSunday,
          always_on_top: true,
          alarm_active: false,
          should_play_sound: false,
          sound_enabled: devMockState.sound_enabled
        };
      } else if (cmd === 'toggle_mode') {
        devMockState.mode = devMockState.mode === 'Horario' ? 'Temporizador' : 'Horario';
      } else if (cmd === 'toggle_sound') {
        devMockState.sound_enabled = !devMockState.sound_enabled;
      } else if (cmd === 'save_block') {
        const newBlock = {
          id: `block-${Date.now()}`,
          title: args.title || 'Nuevo Turno',
          start_hour: args.startHour,
          start_min: args.startMin,
          end_hour: args.endHour,
          end_min: args.endMin,
          color: { r: args.colorR, g: args.colorG, b: args.colorB },
          days: { monday: true, tuesday: true, wednesday: true, thursday: true, friday: true, saturday: true, sunday: false }
        };
        if (args.index !== null && args.index !== undefined && devMockState.blocks[args.index]) {
          devMockState.blocks[args.index] = newBlock;
        } else {
          devMockState.blocks.push(newBlock);
        }
      } else if (cmd === 'delete_block') {
        if (args.index !== null && args.index !== undefined) {
          devMockState.blocks.splice(args.index, 1);
        }
      } else if (cmd === 'close_app') {
        window.close();
      }
      return null;
    }

    const invoke = hasTauri ? window.__TAURI__.core.invoke : mockInvoke;

    let currentEditingIndex = null;
    let activeColor = { r: 59, g: 130, b: 246 };

    const COLOR_PRESETS = [
      { r: 59, g: 130, b: 246 },  // Azul
      { r: 168, g: 85, b: 247 },  // Violeta
      { r: 245, g: 158, b: 11 },  // Ámbar
      { r: 16, g: 185, b: 129 },  // Esmeralda
      { r: 239, g: 68, b: 68 },   // Coral
      { r: 236, g: 72, b: 153 },  // Fucsia
      { r: 6, g: 182, b: 212 }    // Cian
    ];

    function renderPalette() {
      const row = document.getElementById('palette-row');
      row.innerHTML = '';
      COLOR_PRESETS.forEach(col => {
        const swatch = document.createElement('div');
        swatch.className = 'swatch' + (col.r === activeColor.r && col.g === activeColor.g && col.b === activeColor.b ? ' selected' : '');
        swatch.style.background = `rgb(${col.r}, ${col.g}, ${col.b})`;
        swatch.onclick = () => {
          activeColor = col;
          renderPalette();
        };
        row.appendChild(swatch);
      });
    }

    const audioAlarm = document.getElementById('snd-alarm');

    function playAlarm() {
      if (!audioAlarm) return;
      audioAlarm.currentTime = 0;
      audioAlarm.play().catch(e => {
        console.warn('Audio play error:', e);
      });

      const cd = document.getElementById('lbl-countdown');
      if (cd) {
        cd.style.animation = 'alarm-pulse 0.7s ease-in-out 3';
        setTimeout(() => { cd.style.animation = ''; }, 2200);
      }
    }

    let audioUnlocked = false;
    function unlockAudio() {
      if (audioUnlocked || !audioAlarm) return;
      audioAlarm.play().then(() => {
        audioAlarm.pause();
        audioAlarm.currentTime = 0;
        audioUnlocked = true;
      }).catch(() => {});
    }
    window.addEventListener('click', unlockAudio, { once: true });
    window.addEventListener('mousedown', unlockAudio, { once: true });

    async function pollSnapshot() {
      try {
        const snap = await invoke('get_snapshot');
        document.getElementById('lbl-date').textContent = snap.date_title;
        document.getElementById('lbl-time').textContent = snap.current_time_str;
        document.getElementById('lbl-countdown').textContent = snap.countdown_str;
        const blockNameEl = document.getElementById('lbl-block-name');
        blockNameEl.textContent = snap.block_name;
        if (snap.mode === 'Temporizador') {
          blockNameEl.title = 'Haz clic para ajustar la hora meta';
          blockNameEl.style.cursor = 'pointer';
        } else {
          blockNameEl.title = '';
          blockNameEl.style.cursor = 'default';
        }

        document.getElementById('btn-mode').textContent = snap.mode;

        if (snap.should_play_sound) {
          playAlarm();
        }

        const soundBtn = document.getElementById('btn-sound');
        if (soundBtn) {
          soundBtn.textContent = snap.sound_enabled ? '🔔' : '🔇';
          soundBtn.title = snap.sound_enabled 
            ? 'Sonido activado (clic para probar, clic derecho para silenciar)' 
            : 'Sonido silenciado (clic para activar)';
        }

        renderScheduleStream(snap.blocks, snap.current_time_str, snap.is_free_day);
      } catch (e) {
        console.error(e);
      }
    }

    function getBlockIcon(title) {
      const t = (title || '').toLowerCase();
      if (t.includes('almuerzo') || t.includes('comida') || t.includes('lunch') || t.includes('cena')) return '🍽️';
      if (t.includes('desayuno') || t.includes('cafe') || t.includes('café') || t.includes('break')) return '☕';
      if (t.includes('gym') || t.includes('workout') || t.includes('ejercicio') || t.includes('correr') || t.includes('entreno')) return '🏃';
      if (t.includes('ducha') || t.includes('shower') || t.includes('baño') || t.includes('bano')) return '🚿';
      if (t.includes('email') || t.includes('correo') || t.includes('mensaje')) return '✉️';
      if (t.includes('meet') || t.includes('reunion') || t.includes('reunión') || t.includes('call') || t.includes('llamada')) return '📞';
      if (t.includes('brain') || t.includes('code') || t.includes('prog') || t.includes('dev') || t.includes('trabajo')) return '💻';
      if (t.includes('estudio') || t.includes('leer') || t.includes('read') || t.includes('libro')) return '📖';
      return '⚡';
    }

    function formatBlockDuration(startH, startM, endH, endM) {
      let mins = (endH * 60 + endM) - (startH * 60 + startM);
      if (mins < 0) mins += 24 * 60;
      if (mins >= 60) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return m > 0 ? `${h}h ${m}m` : `${h}h`;
      }
      return `${mins} min`;
    }

    function updateEndOfDay(blocks, timeStr, isFreeDay) {
      const el = document.getElementById('lbl-end-of-day');
      if (!el) return;
      if (isFreeDay) {
        el.textContent = 'Día de descanso 🌴';
        return;
      }
      if (!blocks || blocks.length === 0) {
        el.textContent = 'Sin turnos hoy';
        return;
      }

      const [nowH, nowM, nowS] = (timeStr || '00:00:00').split(':').map(Number);
      const nowTotalSecs = nowH * 3600 + nowM * 60 + (nowS || 0);

      let maxEndMins = 0;
      blocks.forEach(b => {
        const endM = b.end_hour * 60 + b.end_min;
        if (endM > maxEndMins) maxEndMins = endM;
      });

      const maxEndSecs = maxEndMins * 60;
      const diffSecs = maxEndSecs - nowTotalSecs;

      if (diffSecs <= 0) {
        el.textContent = 'Fin de jornada: Concluida ✨';
        return;
      }

      const h = Math.floor(diffSecs / 3600);
      const m = Math.floor((diffSecs % 3600) / 60);
      const s = diffSecs % 60;

      if (h > 0) {
        el.textContent = `Fin de jornada: ${h} hrs, ${m} min, ${s} s`;
      } else {
        el.textContent = `Fin de jornada: ${m} min, ${s} s`;
      }
    }

    function renderScheduleStream(blocks, timeStr, isFreeDay) {
      const container = document.getElementById('schedule-container');
      container.innerHTML = '';

      const countBadge = document.getElementById('lbl-agenda-badge');
      if (countBadge) {
        countBadge.textContent = isFreeDay ? 'Día Libre' : `${blocks.length} turnos`;
      }

      updateEndOfDay(blocks, timeStr, isFreeDay);

      if (isFreeDay) {
        const freeCard = document.createElement('div');
        freeCard.className = 'free-day-banner';
        freeCard.innerHTML = `
          <div class="free-day-badge">🌴 DOMINGO FREE</div>
          <div class="free-day-text">Día de descanso. Los turnos de trabajo están activos de lunes a sábado.</div>
        `;
        container.appendChild(freeCard);

        const subTitle = document.createElement('div');
        subTitle.className = 'stream-section-divider';
        subTitle.textContent = 'Horario Semanal (Lun - Sáb)';
        container.appendChild(subTitle);
      }

      const [h, m] = (timeStr || '00:00').split(':').map(Number);
      const nowTotal = h * 60 + m;
      const pad = (num) => String(num).padStart(2, '0');
      const nowStrFormatted = `${pad(h)}:${pad(m)}`;

      // Marcador inicial sol ☀️
      const topPole = document.createElement('div');
      topPole.className = 'timeline-pole';
      topPole.innerHTML = '<span class="pole-icon">☀️</span>';
      container.appendChild(topPole);

      blocks.forEach((block, idx) => {
        const start = block.start_hour * 60 + block.start_min;
        const end = block.end_hour * 60 + block.end_min;

        const isActive = !isFreeDay && (nowTotal >= start && nowTotal < end);
        const isCompleted = !isFreeDay && (nowTotal >= end);

        // Si este bloque está activo ahora, insertamos la línea roja de hora actual antes de él
        if (isActive) {
          const nowDivider = document.createElement('div');
          nowDivider.className = 'timeline-now-divider';
          nowDivider.innerHTML = `
            <span class="now-time-tag">${nowStrFormatted}</span>
            <div class="now-red-line"></div>
          `;
          container.appendChild(nowDivider);
        }

        const row = document.createElement('div');
        row.className = 'timeline-row' + (isActive ? ' active' : '') + (isCompleted ? ' completed' : '');

        const icon = getBlockIcon(block.title);
        const rangeText = `${pad(block.start_hour)}:${pad(block.start_min)}–${pad(block.end_hour)}:${pad(block.end_min)}`;
        const durText = formatBlockDuration(block.start_hour, block.start_min, block.end_hour, block.end_min);
        const colRgb = `${block.color.r}, ${block.color.g}, ${block.color.b}`;

        const checkboxHtml = isCompleted
          ? `<div class="card-checkbox" style="background: rgb(${colRgb}); border: 2px solid rgb(${colRgb}); color: #fff;">✓</div>`
          : `<div class="card-checkbox" style="border: 2px solid rgb(${colRgb}); background: transparent;"></div>`;

        row.innerHTML = `
          <div class="timeline-rail">
            <div class="rail-track-line"></div>
            <div class="timeline-capsule" style="background: rgb(${colRgb}); box-shadow: 0 4px 14px rgba(${colRgb}, 0.4);">
              <span>${icon}</span>
            </div>
          </div>
          <div class="timeline-card">
            <div class="card-body">
              <span class="card-title">${block.title}</span>
              <span class="card-time">${rangeText} <span class="card-duration">(${durText})</span></span>
            </div>
            ${checkboxHtml}
          </div>
        `;

        row.querySelector('.timeline-card').onclick = () => openModal(idx, block);
        container.appendChild(row);
      });

      // Marcador final luna 🌙
      const bottomPole = document.createElement('div');
      bottomPole.className = 'timeline-pole';
      bottomPole.innerHTML = '<span class="pole-icon">🌙</span>';
      container.appendChild(bottomPole);
    }

    function openModal(idx, block) {
      currentEditingIndex = idx;
      const overlay = document.getElementById('editor-overlay');
      const delBtn = document.getElementById('btn-delete');

      if (block) {
        document.getElementById('modal-title').textContent = 'Editar Bloque';
        document.getElementById('inp-title').value = block.title;
        document.getElementById('inp-start-h').value = block.start_hour;
        document.getElementById('inp-start-m').value = block.start_min;
        document.getElementById('inp-end-h').value = block.end_hour;
        document.getElementById('inp-end-m').value = block.end_min;
        activeColor = block.color;
        delBtn.style.display = 'inline-block';
      } else {
        document.getElementById('modal-title').textContent = 'Nuevo Bloque';
        document.getElementById('inp-title').value = 'Nueva Tarea';
        document.getElementById('inp-start-h').value = 8;
        document.getElementById('inp-start-m').value = 0;
        document.getElementById('inp-end-h').value = 12;
        document.getElementById('inp-end-m').value = 0;
        activeColor = COLOR_PRESETS[0];
        delBtn.style.display = 'none';
      }

      renderPalette();
      overlay.classList.add('visible');
    }

    function closeModal() {
      document.getElementById('editor-overlay').classList.remove('visible');
      currentEditingIndex = null;
    }

    // Responsive Scaling Function
    function updateResponsiveScale() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const scaleW = w / 640;
      const scaleH = h / 340;
      const scale = Math.max(0.55, Math.min(2.0, Math.min(scaleW, scaleH)));
      document.documentElement.style.setProperty('--s', scale.toFixed(4));
    }
    window.addEventListener('resize', updateResponsiveScale);
    updateResponsiveScale();

    // Corner and Edge Resizing via Pointer Events
    function initWindowResizing() {
      const corner = document.getElementById('resize-corner');
      const edgeR = document.getElementById('resize-edge-r');
      const edgeB = document.getElementById('resize-edge-b');

      function setupHandle(element, resizeX, resizeY) {
        if (!element) return;
        element.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          e.stopPropagation();

          try { element.setPointerCapture(e.pointerId); } catch (_) {}

          const startScreenX = e.screenX;
          const startScreenY = e.screenY;
          const startW = window.innerWidth;
          const startH = window.innerHeight;

          let animFrameId = null;

          const onPointerMove = (ev) => {
            const deltaX = resizeX ? (ev.screenX - startScreenX) : 0;
            const deltaY = resizeY ? (ev.screenY - startScreenY) : 0;
            const newW = Math.max(320, Math.round(startW + deltaX));
            const newH = Math.max(180, Math.round(startH + deltaY));

            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(() => {
              invoke('resize_window', { width: newW, height: newH });
            });
          };

          const onPointerUp = (ev) => {
            try { element.releasePointerCapture(ev.pointerId); } catch (_) {}
            element.removeEventListener('pointermove', onPointerMove);
            element.removeEventListener('pointerup', onPointerUp);
            element.removeEventListener('pointercancel', onPointerUp);
            if (animFrameId) cancelAnimationFrame(animFrameId);
          };

          element.addEventListener('pointermove', onPointerMove);
          element.addEventListener('pointerup', onPointerUp);
          element.addEventListener('pointercancel', onPointerUp);
        });
      }

      setupHandle(corner, true, true);
      setupHandle(edgeR, true, false);
      setupHandle(edgeB, false, true);
    }
    initWindowResizing();

    // Native OS Window Dragging
    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('button, input, select, textarea, .block-row, .timeline-card, .timeline-capsule, .btn-create-event, .editor-overlay, .swatch, .resize-handle')) {
        return;
      }
      invoke('drag_window');
    });

    // Handlers
    document.getElementById('btn-sound').onclick = async () => {
      const soundBtn = document.getElementById('btn-sound');
      if (soundBtn.textContent === '🔇') {
        await invoke('toggle_sound');
        pollSnapshot();
      } else {
        playAlarm();
      }
    };

    document.getElementById('btn-sound').oncontextmenu = async (e) => {
      e.preventDefault();
      await invoke('toggle_sound');
      pollSnapshot();
    };

    document.getElementById('btn-mode').onclick = async () => {
      await invoke('toggle_mode');
      pollSnapshot();
    };

    document.getElementById('lbl-block-name').onclick = async () => {
      const modeBtn = document.getElementById('btn-mode').textContent;
      if (modeBtn === 'Temporizador') {
        const currentText = document.getElementById('lbl-block-name').textContent;
        const defaultTime = currentText.replace(/[^0-9:]/g, '') || '20:00';
        const newTime = prompt('Ajustar hora meta (HH:MM):', defaultTime);
        if (newTime && newTime.includes(':')) {
          const parts = newTime.split(':').map(Number);
          if (!isNaN(parts[0]) && !isNaN(parts[1])) {
            await invoke('set_timer_target', { hour: parts[0], min: parts[1] });
            pollSnapshot();
          }
        }
      }
    };

    document.getElementById('btn-close').onclick = () => {
      invoke('close_app');
    };

    document.getElementById('btn-open-editor').onclick = () => openModal(null, null);
    document.getElementById('btn-close-modal').onclick = closeModal;
    document.getElementById('btn-cancel').onclick = closeModal;

    document.getElementById('btn-save').onclick = async () => {
      const title = document.getElementById('inp-title').value.trim() || 'Sin título';
      const sh = parseInt(document.getElementById('inp-start-h').value) || 0;
      const sm = parseInt(document.getElementById('inp-start-m').value) || 0;
      const eh = parseInt(document.getElementById('inp-end-h').value) || 0;
      const em = parseInt(document.getElementById('inp-end-m').value) || 0;

      await invoke('save_block', {
        index: currentEditingIndex,
        title,
        startHour: sh,
        startMin: sm,
        endHour: eh,
        endMin: em,
        colorR: activeColor.r,
        colorG: activeColor.g,
        colorB: activeColor.b,
        monday: true, tuesday: true, wednesday: true, thursday: true, friday: true, saturday: true, sunday: false
      });

      closeModal();
      pollSnapshot();
    };

    document.getElementById('btn-delete').onclick = async () => {
      if (currentEditingIndex !== null) {
        await invoke('delete_block', { index: currentEditingIndex });
        closeModal();
        pollSnapshot();
      }
    };

    renderPalette();
    pollSnapshot();
    setInterval(pollSnapshot, 1000);
  </script>
</body>
</html>
