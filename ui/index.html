<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ya Falta Poco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-glass: rgba(14, 18, 27, 0.88);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --card-gradient: linear-gradient(175deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.75) 55%, rgba(30, 64, 175, 0.8) 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }

    /* Contenedor Flotante Ultra Moderno */
    .widget-container {
      width: 610px;
      height: 310px;
      background: var(--bg-glass);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--border-glass);
      border-radius: 28px;
      box-shadow: 
        0 20px 40px -10px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      padding: 16px 20px 18px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Barra Superior Sutil y Discreta */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
      cursor: grab;
    }

    .top-bar:active {
      cursor: grabbing;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .brand-title {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--text-sub);
      text-transform: uppercase;
    }

    .window-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-pill.pinned {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.35);
      color: #38bdf8;
    }

    .btn-close {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: var(--text-sub);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-close:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #f87171;
    }

    /* Layout Principal */
    .content-layout {
      display: grid;
      grid-template-columns: 215px 1fr;
      gap: 20px;
      flex: 1;
      height: calc(100% - 34px);
    }

    /* Tarjeta Izquierda (Hero de Tiempo) */
    .card-hero {
      background: var(--card-gradient);
      border-radius: 22px;
      border: 1px solid var(--border-glass);
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 8px 24px -6px rgba(0, 0, 0, 0.45);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Resplandor orgánico en la base */
    .card-hero::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: 10%;
      width: 80%;
      height: 80px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, transparent 70%);
      pointer-events: none;
    }

    .date-row {
      display: flex;
      flex-direction: column;
    }

    .date-main {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.6px;
      line-height: 1.1;
    }

    .clock-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .countdown-hub {
      text-align: center;
      z-index: 1;
      margin-top: -4px;
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 29px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
      line-height: 1.1;
    }

    .timer-sublabel {
      font-size: 11.5px;
      font-weight: 600;
      color: #93c5fd;
      margin-top: 4px;
      max-width: 175px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-inline: auto;
    }

    .day-info {
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .day-text {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .blocks-stat {
      font-size: 12px;
      font-weight: 500;
      color: #bfdbfe;
    }

    /* Columna Derecha (Agenda de Horarios) */
    .agenda-section {
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
    }

    .agenda-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .agenda-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-sub);
      text-transform: uppercase;
    }

    .schedule-stream {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 4px;
      max-height: 185px;
    }

    .schedule-stream::-webkit-scrollbar {
      width: 4px;
    }
    .schedule-stream::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    /* Item de Bloque de Horario */
    .block-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .block-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .block-card.active {
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.35);
      box-shadow: 0 4px 16px -4px rgba(59, 130, 246, 0.2);
    }

    .block-card.completed {
      opacity: 0.55;
    }

    .block-card.completed .block-name-text {
      text-decoration: line-through;
    }

    .accent-indicator {
      width: 3.5px;
      height: 28px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .block-info-col {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 2px;
    }

    .block-name-text {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .block-time-range {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--text-sub);
    }

    .block-card.active .block-time-range {
      color: #60a5fa;
      font-weight: 600;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      letter-spacing: 0.5px;
    }

    /* Botón Flotante "+" Luminoso */
    .fab-add {
      position: absolute;
      right: 6px;
      bottom: 2px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #0f172a;
      border: 1.5px solid var(--accent-emerald);
      color: #ffffff;
      font-size: 20px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 
        0 4px 14px rgba(16, 185, 129, 0.35),
        inset 0 0 10px rgba(16, 185, 129, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 5;
    }

    .fab-add:hover {
      transform: scale(1.1);
      box-shadow: 
        0 6px 20px rgba(16, 185, 129, 0.55),
        inset 0 0 14px rgba(16, 185, 129, 0.3);
    }

    /* Editor Modal Integrado y Pulido */
    .editor-overlay {
      position: absolute;
      inset: 12px 16px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid var(--border-highlight);
      border-radius: 20px;
      padding: 16px 20px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      z-index: 20;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
    }

    .editor-overlay.visible {
      display: flex;
      animation: fadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .editor-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-heading {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .form-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      width: 60px;
    }

    .text-field {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 6px 12px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .text-field:focus {
      border-color: var(--accent-blue);
      background: rgba(255, 255, 255, 0.08);
    }

    .time-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-field {
      width: 52px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 5px 6px;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      text-align: center;
      outline: none;
    }

    .time-field:focus {
      border-color: var(--accent-blue);
    }

    .palette-row {
      display: flex;
      gap: 8px;
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s;
    }

    .swatch:hover {
      transform: scale(1.15);
    }

    .swatch.selected {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    .action-btn {
      padding: 6px 16px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-save {
      background: var(--accent-blue);
      color: #ffffff;
    }
    .btn-save:hover {
      background: #2563eb;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <!-- Barra Superior Arrastrable -->
    <div class="top-bar" data-tauri-drag-region>
      <div class="brand-tag" data-tauri-drag-region>
        <span class="brand-dot"></span>
        <span class="brand-title" data-tauri-drag-region>Ya Falta Poco</span>
      </div>
      <div class="window-controls">
        <button class="btn-pill" id="btn-mode">Horario</button>
        <button class="btn-pill pinned" id="btn-pin">📌 Fijado</button>
        <button class="btn-close" id="btn-close">✕</button>
      </div>
    </div>

    <!-- Contenido en 2 Bloques -->
    <div class="content-layout">
      <!-- Tarjeta Izquierda (Hero) -->
      <div class="card-hero">
        <div class="date-row">
          <span class="date-main" id="lbl-date">-- --</span>
          <span class="clock-badge" id="lbl-time">00:00:00</span>
        </div>

        <div class="countdown-hub">
          <div class="timer-display" id="lbl-countdown">--:--:--</div>
          <div class="timer-sublabel" id="lbl-block-name">Cargando...</div>
        </div>

        <div class="day-info">
          <span class="day-text" id="lbl-weekday">---</span>
          <span class="blocks-stat" id="lbl-events-count">0 bloques</span>
        </div>
      </div>

      <!-- Sección Derecha (Agenda) -->
      <div class="agenda-section">
        <div class="agenda-header">
          <span class="agenda-title">Hoy</span>
        </div>

        <div class="schedule-stream" id="schedule-container">
          <!-- Bloques inyectados dinámicamente -->
        </div>

        <!-- Botón Añadir Flotante -->
        <button class="fab-add" id="btn-open-editor" title="Añadir Bloque">+</button>
      </div>
    </div>

    <!-- Modal Editor Integrado -->
    <div class="editor-overlay" id="editor-overlay">
      <div class="editor-top">
        <span class="editor-heading" id="modal-title">Nuevo Bloque</span>
        <button class="btn-close" id="btn-close-modal">✕</button>
      </div>

      <div class="form-group">
        <span class="form-label">Nombre</span>
        <input type="text" id="inp-title" class="text-field" placeholder="Nombre de la actividad">
      </div>

      <div class="form-group">
        <span class="form-label">Horario</span>
        <div class="time-inputs">
          <input type="number" id="inp-start-h" class="time-field" min="0" max="23" value="08">
          <span style="color:var(--text-sub)">:</span>
          <input type="number" id="inp-start-m" class="time-field" min="0" max="59" value="00">
          <span style="color:var(--text-sub); margin: 0 4px">hasta</span>
          <input type="number" id="inp-end-h" class="time-field" min="0" max="23" value="12">
          <span style="color:var(--text-sub)">:</span>
          <input type="number" id="inp-end-m" class="time-field" min="0" max="59" value="00">
        </div>
      </div>

      <div class="form-group">
        <span class="form-label">Color</span>
        <div class="palette-row" id="palette-row"></div>
      </div>

      <div class="footer-actions">
        <button class="action-btn btn-delete" id="btn-delete" style="display:none">Eliminar</button>
        <button class="action-btn btn-cancel" id="btn-cancel">Cancelar</button>
        <button class="action-btn btn-save" id="btn-save">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    let currentEditingIndex = null;
    let activeColor = { r: 59, g: 130, b: 246 };

    const COLOR_PRESETS = [
      { r: 59, g: 130, b: 246 },  // Azul Zafiro
      { r: 168, g: 85, b: 247 },  // Violeta
      { r: 245, g: 158, b: 11 },  // Ámbar
      { r: 16, g: 185, b: 129 },  // Esmeralda
      { r: 239, g: 68, b: 68 },   // Coral
      { r: 236, g: 72, b: 153 },  // Fucsia
      { r: 6, g: 182, b: 212 }    // Cian
    ];

    function renderPalette() {
      const row = document.getElementById('palette-row');
      row.innerHTML = '';
      COLOR_PRESETS.forEach(col => {
        const swatch = document.createElement('div');
        swatch.className = 'swatch' + (col.r === activeColor.r && col.g === activeColor.g && col.b === activeColor.b ? ' selected' : '');
        swatch.style.background = `rgb(${col.r}, ${col.g}, ${col.b})`;
        swatch.onclick = () => {
          activeColor = col;
          renderPalette();
        };
        row.appendChild(swatch);
      });
    }

    async function pollSnapshot() {
      try {
        const snap = await invoke('get_snapshot');
        document.getElementById('lbl-date').textContent = snap.date_title;
        document.getElementById('lbl-time').textContent = snap.current_time_str;
        document.getElementById('lbl-countdown').textContent = snap.countdown_str;
        document.getElementById('lbl-block-name').textContent = snap.block_name;
        document.getElementById('lbl-weekday').textContent = snap.weekday_str;
        document.getElementById('lbl-events-count').textContent = snap.events_count_str;
        document.getElementById('btn-mode').textContent = snap.mode;

        const pinBtn = document.getElementById('btn-pin');
        if (snap.always_on_top) {
          pinBtn.classList.add('pinned');
          pinBtn.textContent = '📌 Fijado';
        } else {
          pinBtn.classList.remove('pinned');
          pinBtn.textContent = '📌 Libre';
        }

        renderScheduleStream(snap.blocks, snap.current_time_str);
      } catch (e) {
        console.error(e);
      }
    }

    function renderScheduleStream(blocks, timeStr) {
      const container = document.getElementById('schedule-container');
      container.innerHTML = '';

      const [h, m] = timeStr.split(':').map(Number);
      const nowTotal = h * 60 + m;

      blocks.forEach((block, idx) => {
        const start = block.start_hour * 60 + block.start_min;
        const end = block.end_hour * 60 + block.end_min;

        const isActive = nowTotal >= start && nowTotal < end;
        const isCompleted = nowTotal >= end;

        const card = document.createElement('div');
        card.className = 'block-card' + (isActive ? ' active' : '') + (isCompleted ? ' completed' : '');
        card.onclick = () => openModal(idx, block);

        const pad = (num) => String(num).padStart(2, '0');
        const rangeText = `${pad(block.start_hour)}:${pad(block.start_min)} - ${pad(block.end_hour)}:${pad(block.end_min)}`;

        card.innerHTML = `
          <div class="accent-indicator" style="background: rgb(${block.color.r}, ${block.color.g}, ${block.color.b})"></div>
          <div class="block-info-col">
            <span class="block-name-text">${block.title}</span>
            <span class="block-time-range">${rangeText}</span>
          </div>
          ${isActive ? '<span class="status-badge">En curso</span>' : ''}
        `;

        container.appendChild(card);
      });
    }

    function openModal(idx, block) {
      currentEditingIndex = idx;
      const overlay = document.getElementById('editor-overlay');
      const delBtn = document.getElementById('btn-delete');

      if (block) {
        document.getElementById('modal-title').textContent = 'Editar Bloque';
        document.getElementById('inp-title').value = block.title;
        document.getElementById('inp-start-h').value = block.start_hour;
        document.getElementById('inp-start-m').value = block.start_min;
        document.getElementById('inp-end-h').value = block.end_hour;
        document.getElementById('inp-end-m').value = block.end_min;
        activeColor = block.color;
        delBtn.style.display = 'inline-block';
      } else {
        document.getElementById('modal-title').textContent = 'Nuevo Bloque';
        document.getElementById('inp-title').value = 'Nueva Tarea';
        document.getElementById('inp-start-h').value = 8;
        document.getElementById('inp-start-m').value = 0;
        document.getElementById('inp-end-h').value = 12;
        document.getElementById('inp-end-m').value = 0;
        activeColor = COLOR_PRESETS[0];
        delBtn.style.display = 'none';
      }

      renderPalette();
      overlay.classList.add('visible');
    }

    function closeModal() {
      document.getElementById('editor-overlay').classList.remove('visible');
      currentEditingIndex = null;
    }

    // Handlers
    document.getElementById('btn-mode').onclick = async () => {
      await invoke('toggle_mode');
      pollSnapshot();
    };

    document.getElementById('btn-pin').onclick = async () => {
      await invoke('toggle_pin');
      pollSnapshot();
    };

    document.getElementById('btn-close').onclick = () => {
      invoke('close_app');
    };

    document.getElementById('btn-open-editor').onclick = () => openModal(null, null);
    document.getElementById('btn-close-modal').onclick = closeModal;
    document.getElementById('btn-cancel').onclick = closeModal;

    document.getElementById('btn-save').onclick = async () => {
      const title = document.getElementById('inp-title').value.trim() || 'Sin título';
      const sh = parseInt(document.getElementById('inp-start-h').value) || 0;
      const sm = parseInt(document.getElementById('inp-start-m').value) || 0;
      const eh = parseInt(document.getElementById('inp-end-h').value) || 0;
      const em = parseInt(document.getElementById('inp-end-m').value) || 0;

      await invoke('save_block', {
        index: currentEditingIndex,
        title,
        startHour: sh,
        startMin: sm,
        endHour: eh,
        endMin: em,
        colorR: activeColor.r,
        colorG: activeColor.g,
        colorB: activeColor.b,
        monday: true, tuesday: true, wednesday: true, thursday: true, friday: true, saturday: true, sunday: true
      });

      closeModal();
      pollSnapshot();
    };

    document.getElementById('btn-delete').onclick = async () => {
      if (currentEditingIndex !== null) {
        await invoke('delete_block', { index: currentEditingIndex });
        closeModal();
        pollSnapshot();
      }
    };

    renderPalette();
    pollSnapshot();
    setInterval(pollSnapshot, 1000);
  </script>
</body>
</html>
